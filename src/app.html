<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
		
		<link
			rel="icon"
			type="image/png"
			href="%sveltekit.assets%/favicon-512.png?v=5"
			sizes="512x512"
		/>
		<link rel="apple-touch-icon" href="%sveltekit.assets%/favicon-512.png?v=5" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json?v=5" />

		<style>
			body {
				font-family:
					-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
			}
		</style>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Helvetica+Neue:wght@700&display=swap"
			rel="stylesheet"
			media="print"
			onload="this.media='all'"
		/>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
